<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Website Under Maintenance | Jos&eacute; Manuel Camacho S&aacute;nchez</title>
  <style>
    :root {
      --ink: #18222f;
      --muted: #5f6b7a;
      --line: rgba(205, 219, 230, 0.72);
      --navy: #143b63;
      --accent: #1f6f8b;
      --panel: rgba(255, 255, 255, 0.78);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 18% 22%, rgba(31, 111, 139, 0.16), transparent 28rem),
        radial-gradient(circle at 84% 74%, rgba(20, 59, 99, 0.12), transparent 26rem),
        linear-gradient(180deg, #f9fbfc 0%, #eef4f7 100%);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 1.25rem;
    }

    main {
      width: min(100%, 760px);
      border: 1px solid var(--line);
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.9), var(--panel));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.82),
        0 20px 56px rgba(24, 34, 47, 0.11);
      backdrop-filter: blur(18px) saturate(135%);
      -webkit-backdrop-filter: blur(18px) saturate(135%);
      padding: clamp(2rem, 6vw, 4rem);
    }

    .kicker {
      display: inline-block;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0;
      margin-bottom: 0.85rem;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(2.25rem, 7vw, 4.6rem);
      line-height: 0.98;
      letter-spacing: 0;
      margin: 0 0 1.1rem;
    }

    p {
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.18rem);
      line-height: 1.65;
      margin: 0;
      max-width: 36rem;
    }

    .signature {
      color: var(--navy);
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0;
      margin-top: 2rem;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <span class="kicker">Jos&eacute; Manuel Camacho S&aacute;nchez, PhD</span>
    <h1>Website under maintenance</h1>
    <p>
      I am currently updating this academic website. It will be available again soon.
    </p>
    <div class="signature">Experimental aerodynamics of bluff bodies and heavy vehicles</div>
  </main>
</body>
</html>
